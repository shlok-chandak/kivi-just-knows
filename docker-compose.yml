services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kivi
      POSTGRES_PASSWORD: kivi
      POSTGRES_DB: kivi
    ports:
      - "5432:5432"
    volumes:
      - kivi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kivi -d kivi"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./corpus:/app/corpus
      - ./scripts:/app/scripts
      # Recorded eval runs, for the results screen to read back. Read-only:
      # the API reports measurements, it must never be able to edit them.
      - ./evaluation:/app/evaluation:ro

  worker:
    build: ./backend
    command: python -m app.worker.main
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./corpus:/app/corpus
      - ./scripts:/app/scripts

volumes:
  kivi_pgdata:
